name: LabelGuard checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m labelguard.cli index
      - run: ruff check labelguard tests scripts loadtests
      - run: pytest -q
      - run: python -m labelguard.cli evaluate
      - name: Require all v2 fixture cases to pass
        run: python -c "import json; r=json.load(open('output/evaluation/results.json'))['variants']['v2']; assert r['correct']==r['scenario_count']"
      - run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-set-evaluation
          path: output/evaluation/results.json
