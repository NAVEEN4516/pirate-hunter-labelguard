global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: research
    dns_sd_configs:
      - names: [agent-worker]
        type: A
        port: 9101
        refresh_interval: 10s
  - job_name: verification
    dns_sd_configs:
      - names: [verifier-worker]
        type: A
        port: 9101
        refresh_interval: 10s
  - job_name: provider
    static_configs:
      - targets: [provider-stub:8010]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: jaeger
    static_configs:
      - targets: [jaeger:14269]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
