[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pirate-hunter-labelguard"
version = "1.0.0"
description = "Evidence-grounded packaged breakfast cereal label compliance service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "langgraph>=0.3,<2", "langchain-community>=0.3,<1",
  "faiss-cpu>=1.10,<2", "scikit-learn>=1.5,<2", "pypdf>=5,<7",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "locust>=2.33,<3", "ruff>=0.11,<1"]

[project.scripts]
labelguard = "labelguard.cli:main"

[tool.setuptools.packages.find]
include = ["labelguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
